name: CI
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev,tui]'
      - run: lint-imports
      - run: pytest -q
      - run: python scripts/render_docs.py --check

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[browser-test]'
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q tests/web

  terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/terminal/package-lock.json
      - run: pip install -e '.[dev,pi]' build
      - run: npm ci --prefix ui/terminal --ignore-scripts
      - run: npm test --prefix ui/terminal
      - run: python scripts/terminal_assets.py prepare
      - run: python -m build
      - run: python scripts/check_source_build.py
      - run: python scripts/check_dist.py --dist dist --version "$(python -c 'from openrua import __version__; print(__version__)')"
