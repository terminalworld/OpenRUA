name: Release
# A pushed version tag (v0.0.8) becomes a GitHub Release: the package
# is built and checked, the sdist and wheel are attached, and the notes
# are generated from the commits since the previous tag. Publishing to
# PyPI stays a separate, deliberate step.
on:
  push:
    tags: ["v[0-9]*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: |
          test "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "${GITHUB_REF_NAME#v}" \
            || { echo "tag $GITHUB_REF_NAME does not match pyproject version" >&2; exit 1; }
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
