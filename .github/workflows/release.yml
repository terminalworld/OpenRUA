name: Release
# Version tags publish one tested milestone to GitHub and PyPI.
on:
  push:
    tags: ["v[0-9]*"]
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix ui/terminal --ignore-scripts
      - run: python scripts/terminal_assets.py prepare
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: |
          test "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "${GITHUB_REF_NAME#v}" \
            || { echo "tag $GITHUB_REF_NAME does not match pyproject version" >&2; exit 1; }
      - run: python scripts/check_dist.py --dist dist --version "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract release notes
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text()
          marker = f"## {version}\n"
          if marker not in changelog:
              raise SystemExit(f"CHANGELOG.md has no entry for {version}")
          notes = changelog.split(marker, 1)[1].split("\n## ", 1)[0].strip()
          Path("release-notes.md").write_text(notes + "\n")
          PY
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
