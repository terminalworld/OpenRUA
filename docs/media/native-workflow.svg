<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title description">
  <title id="title">A coding project connected to a robot</title>
  <desc id="description">Claude Code or Codex runs in a prepared sandbox and uses ros2 CLI and rclpy to exchange commands, observations and feedback with a real or simulated robot. Programs, observations and notes remain in the coding project across conversations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#0969da" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="760" height="380" rx="16" fill="#ffffff"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#1f2328">
    <rect x="20" y="20" width="300" height="190" rx="14" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="42" y="65" font-size="30" font-weight="650">Coding agent</text>
    <text x="42" y="99" font-size="22" fill="#59636e">Prepared sandbox</text>
    <text x="42" y="141" font-size="24">Claude Code / Codex</text>
    <text x="42" y="180" font-size="24" fill="#0969da">ros2 CLI · rclpy</text>
    <path d="M 340 125 H 420" fill="none" stroke="#0969da" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="380" y="99" text-anchor="middle" font-size="22" fill="#0969da">ROS 2</text>
    <rect x="440" y="20" width="300" height="190" rx="14" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="462" y="65" font-size="30" font-weight="650">Robot</text>
    <text x="462" y="103" font-size="24">Real or simulated</text>
    <text x="462" y="141" font-size="24">Cameras · sensors</text>
    <text x="462" y="180" font-size="24">Native controllers</text>
    <path d="M 170 220 V 250" fill="none" stroke="#0969da" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <rect x="20" y="260" width="720" height="100" rx="14" fill="#ddf4ff" stroke="#b6e3ff"/>
    <text x="42" y="300" font-size="28" font-weight="650">Your coding project</text>
    <text x="718" y="300" text-anchor="end" font-size="22" fill="#0969da">Saved across conversations</text>
    <text x="42" y="339" font-size="24">Programs · observations · notes</text>
  </g>
</svg>
