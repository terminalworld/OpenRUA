[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openrua"
version = "0.0.6"
description = "Let your Claude Code or Codex control any robot, real or simulated, through the standard ROS 2 CLI and client library."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Zhaoyang Chu", email = "zhaoyang.chu.25@ucl.ac.uk" }]
keywords = ["robotics", "ros2", "claude-code", "codex", "coding-agent", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # rclpy comes from the ROS distribution (system site-packages), never from pip.
    # Simulator deps (robosuite / LIBERO / RoboCasa) live in the substrate venvs.
    "numpy",
    "pyyaml",
    "pydantic>=2",
]

[project.optional-dependencies]
demo = ["pillow", "numpy", "imageio", "imageio-ffmpeg"]
dev = ["pytest", "import-linter", "pillow", "numpy", "imageio", "imageio-ffmpeg"]

[project.urls]
Homepage = "https://github.com/terminalworld/OpenRUA"
Repository = "https://github.com/terminalworld/OpenRUA"

[project.scripts]
openrua = "openrua.cli:main"
openrua-bridge = "openrua.robot.sim.bridge.main:main"

[tool.hatch.build.targets.wheel]
packages = ["openrua"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# Architecture contract (machine-enforced by tests/test_layering.py; the
# import-linter config below states the same rules). Prose version:
# docs/architecture.md.
#
#   robot       the machine the agent operates, provided by a backend
#               (sim/ or real/; up() dispatches on backend.kind). The
#               host side is data-fed; sim/bridge/ is the simulated
#               robot's own software (container: environments + engines
#               + ros + rpc + main). Inside the bridge the four parts
#               never see each other (parameters only, passed by main).
#               Host code never imports the bridge (rclpy lives in the
#               container).
#   sandbox     the agent's terminal: machine + config -> live sandbox
#               container with the workspace docs seeded; imports no
#               other layer (what the agent experiences knows nothing
#               about scoring)
#   proxy       the whitelist proxy; imports no other unit
#   agents      the agent contract, the registry (manifests under
#               configs/agents, hooks under plugins/agents), the launcher,
#               the prompts; imports config and errors only
#   runner      running trials: main, bringup, trial, operators, session,
#               preflight (every promise the workspace docs make, verified
#               before the agent starts), record (sole writer under runs/),
#               lock.
#               preflight, record and lock are leaves; the rest imports
#               every host-side unit, never openrua.robot.sim.bridge
#   cli         the command line (openrua up | down | agent | run | ...);
#               one module per verb, composing the units above
#   config, errors, testing
#               leaves shared by the host side: the schema, the loader and
#               where things live; the error family; the agent conformance
#               test. The bridge imports none of them (resolved paths and
#               validated dicts reach it as data). doctor sits with cli
#               above the units: no unit imports it.
#
# Cross-layer communication otherwise: (1) configs at startup
# (configs/robots, configs/benchmarks), (2) the DDS / subprocess boundary
# at runtime, (3) files under runs/.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "openrua"

[[tool.importlinter.contracts]]
name = "nobody host-side imports the bridge (container-only; DDS/stdio reach it)"
type = "forbidden"
source_modules = ["openrua.cli", "openrua.runner", "openrua.sandbox", "openrua.proxy", "openrua.agents"]
forbidden_modules = ["openrua.robot.sim.bridge"]

[[tool.importlinter.contracts]]
name = "only the runner brings robots up"
type = "forbidden"
source_modules = ["openrua.runner.preflight", "openrua.runner.record", "openrua.sandbox", "openrua.proxy", "openrua.agents"]
forbidden_modules = ["openrua.robot"]

[[tool.importlinter.contracts]]
name = "the bridge is self-contained (nothing from openrua outside itself)"
type = "forbidden"
source_modules = ["openrua.robot.sim.bridge"]
forbidden_modules = ["openrua.cli", "openrua.runner", "openrua.sandbox", "openrua.proxy", "openrua.agents", "openrua.robot.base", "openrua.robot.real", "openrua.robot.sim.build", "openrua.robot.sim.install", "openrua.robot.sim.up", "openrua.robot.sim.down", "openrua.robot.sim.client"]

[[tool.importlinter.contracts]]
name = "the robot host side consumes data only (no shared leaf, never the bridge, no host layer)"
type = "forbidden"
source_modules = ["openrua.robot.base", "openrua.robot.real", "openrua.robot.sim.build", "openrua.robot.sim.install", "openrua.robot.sim.up", "openrua.robot.sim.down", "openrua.robot.sim.client"]
forbidden_modules = ["openrua.cli", "openrua.runner", "openrua.sandbox", "openrua.proxy", "openrua.agents", "openrua.config", "openrua.robot.sim.bridge"]

[[tool.importlinter.contracts]]
name = "environments, engines, ros, rpc never see each other (parameters only)"
type = "independence"
modules = ["openrua.robot.sim.bridge.environments", "openrua.robot.sim.bridge.engines", "openrua.robot.sim.bridge.ros", "openrua.robot.sim.bridge.rpc"]

[[tool.importlinter.contracts]]
name = "sandbox imports no other unit (what the agent experiences knows nothing about scoring)"
type = "forbidden"
source_modules = ["openrua.sandbox"]
forbidden_modules = ["openrua.runner", "openrua.cli"]

[[tool.importlinter.contracts]]
name = "preflight and record are leaves (handles and paths are handed in)"
type = "forbidden"
source_modules = ["openrua.runner.preflight", "openrua.runner.record"]
forbidden_modules = ["openrua.sandbox", "openrua.proxy", "openrua.agents", "openrua.cli"]

[[tool.importlinter.contracts]]
name = "leaves import no layer (agents, proxy)"
type = "forbidden"
source_modules = ["openrua.agents", "openrua.proxy"]
forbidden_modules = ["openrua.runner", "openrua.sandbox", "openrua.cli"]

[[tool.importlinter.contracts]]
name = "the bridge never sees the host-side leaves (config, errors, doctor, testing)"
type = "forbidden"
source_modules = ["openrua.robot.sim.bridge"]
forbidden_modules = ["openrua.config", "openrua.errors", "openrua.doctor", "openrua.testing"]

[[tool.importlinter.contracts]]
name = "no unit imports the top layer (cli, doctor, testing)"
type = "forbidden"
source_modules = ["openrua.robot", "openrua.sandbox", "openrua.proxy", "openrua.agents", "openrua.runner", "openrua.config", "openrua.errors", "openrua.demo"]
forbidden_modules = ["openrua.cli", "openrua.doctor", "openrua.testing"]

[[tool.importlinter.contracts]]
name = "demo reads a trial's files and imports errors only"
type = "forbidden"
source_modules = ["openrua.demo"]
forbidden_modules = ["openrua.robot", "openrua.sandbox", "openrua.proxy", "openrua.agents", "openrua.runner", "openrua.config", "openrua.cli", "openrua.doctor", "openrua.testing"]

[[tool.importlinter.contracts]]
name = "hooks modules import the agent contract only"
type = "forbidden"
source_modules = ["openrua.plugins"]
forbidden_modules = ["openrua.agents.registry", "openrua.agents.launcher", "openrua.agents.credentials", "openrua.agents.prompts", "openrua.config", "openrua.errors", "openrua.robot", "openrua.sandbox", "openrua.proxy", "openrua.runner", "openrua.cli", "openrua.doctor", "openrua.testing"]

[[tool.importlinter.contracts]]
name = "units read validated dicts, never the config schema"
type = "forbidden"
source_modules = ["openrua.robot", "openrua.sandbox", "openrua.proxy", "openrua.runner.preflight", "openrua.runner.record"]
forbidden_modules = ["openrua.config"]
