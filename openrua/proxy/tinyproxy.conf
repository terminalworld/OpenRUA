# Model-API-only proxy. The sandbox reaches the internet exclusively
# through this proxy, and the proxy forwards exclusively to the
# whitelisted model API hosts. Everything else is refused: inference
# traffic flows, every other tool stays offline.
Port 8888
Timeout 600
MaxClients 32

# Whitelist filtering: default-deny, allow only the filter file entries.
Filter "/etc/tinyproxy/filter"
FilterURLs Off
FilterExtended On
FilterDefaultDeny Yes

# Only HTTPS CONNECT to 443 is ever needed.
ConnectPort 443
