# robosuite (MuJoCo): the engine every bundled benchmark runs on. This
# file knows the engine and how it drives each robot type it embodies;
# it knows no benchmark. A benchmark brings its own world (install:,
# scenes:) and may add robots the engine's own assets lack.

engine: robosuite 1.5 on MuJoCo
entry_point: robosuite       # bridge engine: joint addressing, poses, cameras, actions over a robosuite env

install:                     # the stock engine: robosuite 1.5.1 in the CaP-X checkout
  ros_distro: humble         # names the robot and sandbox images (openrua-sim-humble, openrua-sandbox-humble)
  python: "3.10"
  checkouts:                 # cloned into the image at the pinned commits (openrua build --sim robosuite)
    - path: cap-x
      repo: https://github.com/capgym/cap-x.git
      commit: 53e9966d7a8e2fa7494676772bccc35280f5c0ed
      submodules: [capx/third_party/sam3, capx/third_party/robosuite,
                   capx/third_party/LIBERO-PRO, capx/third_party/libero_dependencies/robosuite]
      patch: robosuite/capx-pyproject.patch   # CPU-only pyproject (no CUDA, verl, curobo)
  requirements: robosuite/requirements.txt   # uv pip freeze of the venv the reported runs used
  editable: [cap-x, cap-x/capx/third_party/robosuite]

native:                      # `openrua run <robot> --sim robosuite` with no --bench
  entry_point: robosuite     # bridge loader: robosuite.make on the engine's own env
  scene: Lift                # a table with a red cube
  cameras:
    resolution: [640, 480]
    list: null               # publish every camera the scene defines
    rate_hz: 2               # wall-clock render/publish rate (pull-style; never steps)
    record: [agentview, robot0_eye_in_hand]  # --record default: main view, inset

# Observations about robosuite-backed machines that no field can say,
# joined into machine.yaml for the kinds a machine has (robot type, then
# this file, then the embodiment, then the benchmark scene).
notes:
  timing:
    - At the start of an episode the scene may not have settled; objects
      can sit slightly above their supports until commands run.
  joint_trajectory:
    - Give large moves 2 to 4 s; shorter durations overshoot.
    - A tolerance violation at the end of a long goal is usually
      controller lag, not an obstruction; resending the same goal
      typically converges.
  gripper:
    - The reported finger position takes a few ticks to settle, and the
      measured full opening sits slightly under open.
  camera:
    - Side-view cameras overestimate the height of low, flat objects near
      their edges; cross-view disagreement on such objects usually traces
      to this.
  odometry:
    - Arm contact and reaction forces can move the mobile base by
      centimetres; re-read odometry after arm work before trusting a
      stored base pose.
  planning:
    - IK reads poses, and FK returns them, in planning.planning_frame
      whatever the message headers say; leave frame_id empty in IK
      requests.
    - Collision meshes carry about a centimetre of padding; trust
      measurements over nominals.
    - IK and FK requests hang when their robot_state carries joints
      outside the arm, finger joints included; seed them with the arm
      joints only.

robots:
  panda:
    engine_model: Panda      # robosuite's name for it
    controller: JOINT_POSITION  # base action space (real-robot shape: both
                                # ports above a joint layer; OSC's null-space
                                # bias fights joint-space trajectory goals)
    controller_kp_scale: 1   # the composite JOINT_POSITION config carries
                             # tuned gains (kp=1500, absolute input); a
                             # benchmark on an older robosuite may scale
    joint_name_map:          # robosuite internal -> franka_ros2 published names
      robot0_: panda_
      gripper0_: panda_
    gripper:                 # the bridge reads a goal as open or closed,
      holds_partway: false   # whichever is nearer, and sets no force limit
      effort_honoured: false
      joint: panda_right_finger_joint1   # robosuite 1.5 names the fingers right_
    control:                 # graph-side actuation behavior
      gripper:
        settle_steps: 10       # control ticks a gripper goal advances the world
    tf:
      hand: false            # robot_state_publisher (MoveIt stack) owns the
                             # arm chain; the bridge keeps base + cameras
      base_body: robot0_base
      hand_body: robot0_right_hand
    planning:
      planning_frame: world  # MoveIt's model frame: the SRDF's floating virtual joint
                             # world->panda_link0 follows the bridge's TF, so IK reads
                             # poses and FK returns them in world coordinates
