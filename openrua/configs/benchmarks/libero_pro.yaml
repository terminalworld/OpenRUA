# LIBERO-PRO benchmark config: the only place this benchmark's specifics live.
# Sections: task (what runs), protocol (how trials run and when they
# stop), agent (who operates), robot + simulator (what it runs on),
# install (the venv and distro this benchmark brings), scenes (what it
# puts in the world).

task:
  benchmark: libero_pro
  # The six comparable cells = (goal, spatial, object) x (swap, task),
  # written out because this list is what a batch runs and what results
  # are keyed by. Identical to cap-x's own default suite list
  # (capx/envs/scripts/run_libero_batch.py).
  suites: [libero_goal_swap, libero_goal_task,
           libero_spatial_swap, libero_spatial_task,
           libero_object_swap, libero_object_task]
  init_states: benchmark-files    # fixed .init files, never random

protocol:
  trials_per_task: 10    # 10 first for a partial comparison, then 50 =
                         # cap-x's grid. Composable because seeds index
                         # the official init files in order: seeds 0-9
                         # are states 0-9, 10-49 add states 10-49.
  # cap-x's own LIBERO horizon is 8000 sim steps
  # (capx/envs/scripts/run_libero_batch.py -> FrankaLiberoEnv max_steps,
  # which becomes robosuite's env horizon). Trials run unbounded and are
  # re-scored post hoc at their number: every trial stamps
  # success_at.step, so the 8000-step column is recoverable. The env
  # horizon comes from protocol.horizon, absent here and therefore 10**9.
  # capx_horizon_steps: 8000  (their number; documentation, not a control)
  max_turns: 500         # generous ceiling; budgets are applied post hoc
                         # from the per-trial stamps, and a near-miss
                         # failure wastes the whole trial's quota
  active_wall_clock_minutes: 240  # generous ceiling for the same reason;
                         # no community wall-clock convention exists.
                         # Either bound ends the trial; the runner
                         # enforces the wall clock.
  # Waiting out a quota wall is bounded: past either bound the trial
  # gives up as quota-limited and the caller requeues it. 360 min covers
  # a five-hour window with slack; a weekly wall is not waited out.
  max_quota_wait_minutes: 360
  max_suspensions: 4
  # Suspend at a quota wall and resume the same session instead of losing
  # the trial. On for these runs and off by default in the code: the wall
  # comes from running at scale on subscription accounts, not from the
  # method, and a single-trial reproduction through an API key never
  # meets one. Recorded per trial, so a result says which way it ran.
  resume_on_quota_wall: true
  clock:
    mode: paused         # free_running is the sub-experiment switch

agent:
  name: claude-code      # the agent (configs/agents/claude-code.yaml)
  model: claude-opus-5
  options:
    effort: high         # reasoning effort, pinned so a CLI default change
                         # cannot drift it; stamped into each trial's meta
  # The opening prompt is agents.PROMPT; its sha256 is recorded per run.

robot: panda              # configs/robots/panda.yaml
simulator: robosuite      # configs/simulators/robosuite.yaml; LIBERO ships its own fork of it

install:                  # LIBERO's world: its robosuite 1.4 fork in the CaP-X checkout
  venv: cap-x/.venv-libero   # relative to ~/.openrua/simulators/; py3.12 == Jazzy
  ros_distro: jazzy       # names the robot and sandbox images (openrua-sim-jazzy, openrua-sandbox-jazzy)

scenes:
  default_suite: libero_goal_task  # what `openrua run --bench libero_pro` loads (the
                                   # unperturbed goal suite; swap/spatial/object are the
                                   # benchmark's other cells)
  cameras:                # the scene's own cameras, unchanged
    resolution: [640, 480]
    list: null            # publish every camera the scene defines
    rate_hz: 2            # wall-clock render/publish rate (pull-style; never steps)
    record: [agentview, robot0_eye_in_hand]  # --record default: main view, inset
  robots:
    panda:
      controller_kp_scale: 10  # LIBERO's robosuite 1.4: stock kp=50 tracks ~15% of a
                               # 20 Hz setpoint; measured gain: x10 -> 0.92, x20 overshoots
