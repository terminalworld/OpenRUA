# RoboCasa365 benchmark config. Same bridge code as the other benchmarks;
# the increment over the arm-only ones is the mobile base: /cmd_vel in,
# /odom out. Envs are built through robosuite.make with their factory
# kwargs verbatim (see environments/robocasa.py); only controller_configs
# is swapped to the JOINT_POSITION composite. Tasks, scenes, predicates
# and split stay theirs.
# Four top-level sections: task / protocol / agent / robot.

task:
  benchmark: robocasa365
  # The official target50 evaluation set, copied out of their
  # dataset_registry.py (TARGET_TASKS / TASK_SET_REGISTRY["target50"]):
  # 18 atomic-seen + 16 composite-seen + 16 composite-unseen = 50 tasks,
  # "50 representative ones out of the 365 tasks" (their paper 3.4.2).
  # The suite string is their env-registry name (no prefix); task_id is
  # unused here (one env per name).
  suites:
    # --- atomic_seen (18) ---
    - CloseBlenderLid
    - CloseFridge
    - CloseToasterOvenDoor
    - CoffeeSetupMug
    - NavigateKitchen
    - OpenCabinet
    - OpenDrawer
    - OpenStandMixerHead
    - PickPlaceCounterToCabinet
    - PickPlaceCounterToStove
    - PickPlaceDrawerToCounter
    - PickPlaceSinkToCounter
    - PickPlaceToasterToCounter
    - SlideDishwasherRack
    - TurnOffStove
    - TurnOnElectricKettle
    - TurnOnMicrowave
    - TurnOnSinkFaucet
    # --- composite_seen (16) ---
    - DeliverStraw
    - GetToastedBread
    - KettleBoiling
    - LoadDishwasher
    - PackIdenticalLunches
    - PreSoakPan
    - PrepareCoffee
    - RinseSinkBasin
    - ScrubCuttingBoard
    - SearingMeat
    - SetUpCuttingStation
    - StackBowlsCabinet
    - SteamInMicrowave
    - StirVegetables
    - StoreLeftoversInBowl
    - WashLettuce
    # --- composite_unseen (16) ---
    - ArrangeBreadBasket
    - ArrangeTea
    - BreadSelection
    - CategorizeCondiments
    - CuttingToolSelection
    - GarnishPancake
    - GatherTableware
    - HeatKebabSandwich
    - MakeIceLemonade
    - PanTransfer
    - PortionHotDogs
    - RecycleBottlesByType
    - SeparateFreezerRack
    - WaffleReheat
    - WashFruitColander
    - WeighIngredients
  split: target              # held-out layouts/styles 1-10 (their eval
                             # split mapping, copied verbatim)
  init_states: seeded-reset  # seed -> env.rng -> reset (their gym
                             # wrapper's semantics)

protocol:
  trials_per_task: 10        # ten rollouts per task, drawn their way.
                             # Their protocol is 50 rollouts per task with
                             # the (layout, style) pair drawn per reset
                             # (kitchen.py rng.choice); the count is cut to
                             # ten and nothing else changes. Ten i.i.d.
                             # draws cover about 6.5 of the ten target
                             # kitchens; so do their fifty, unevenly. The
                             # count is the only declared deviation.
  max_turns: 500             # generous ceiling; budgets are applied post hoc
  active_wall_clock_minutes: 240    # generous ceiling; budgets are applied
                             # post hoc from the success_at stamps
  # Waiting out a quota wall is bounded: past either bound the trial
  # gives up as quota-limited and the caller requeues it. 360 min covers
  # a five-hour window with slack; a weekly wall is not waited out.
  max_quota_wait_minutes: 360
  max_suspensions: 4
  # Suspend at a quota wall and resume the same session instead of losing
  # the trial. On for these runs and off by default in the code (see
  # libero_pro.yaml). Recorded per trial.
  resume_on_quota_wall: true
  clock:
    mode: paused
  base_cmd_policy: queue   # queue = one message -> one tick, deterministic,
                           # bounded at depth 4 so a flood cannot queue
                           # displacement. latest = real-robot setpoint
                           # semantics (free-running clocks only).

agent:                       # same agent and workspace template as libero_pro
  name: claude-code      # the agent (configs/agents/claude-code.yaml)
  model: claude-opus-5
  options:
    effort: high         # reasoning effort, pinned so a CLI default change
                         # cannot drift it; stamped into each trial's meta

robot: panda-omron-sim          # configs/robots/panda-omron-sim.yaml supplies the machine: section
