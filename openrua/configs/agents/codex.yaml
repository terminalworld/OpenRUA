# Codex (OpenAI): the facts OpenRUA needs about this agent. The behaviour
# (launch command, transcript parsing) is the module named by entry_point at the
# bottom. Facts read from codex-cli 0.145.0 --help and its JSONL output.
name: codex
title: Codex
default_model: gpt-5.6-sol
binary: codex
# Root shell that installs the CLI into the sandbox image (build time only).
# {version} is replaced with a pin when one is given (openrua build sandbox
# --agent codex@0.161.0, or agent.version in a config); without a pin the
# release current at build time is installed.
prepare: >-
  apt-get update
  && apt-get install -y --no-install-recommends curl ca-certificates
  && curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  && apt-get install -y --no-install-recommends nodejs
  && rm -rf /var/lib/apt/lists/*
prepare_check: node -e 'if (parseInt(process.versions.node) < 22) process.exit(1)'
install: npm install -g @openai/codex@{version}
# Hosts the CLI must reach through the proxy: the API, the ChatGPT-login
# backend and the auth service.
whitelist:
  - '^api\.openai\.com$'
  - '^chatgpt\.com$'
  - '^auth\.openai\.com$'
# Reuse the native file-based login through an OpenRUA directory alias.
# Explicit credentials_dir selects a separate profile; secrets are not copied.
credentials:
  native_dir: .codex
  dirname: codex
  filename: auth.json
  config_env: CODEX_HOME
  mount_point: /codex-home
  # Its own sign-in, which openrua login runs in the sandbox image: a link
  # and a one-time code to enter there (device code: nothing has to reach
  # back into the container).
  login: [codex, login, --device-auth]
# An API key, passed to the CLI by file; bills the API, not a subscription.
token_env: OPENAI_API_KEY
# Where the newest release is named, for the update offer at start.
latest_release: https://registry.npmjs.org/@openai/codex/latest
version_argv: [codex, --version]
# Knobs a config may override under agent.options:
# - effort: reasoning effort (model_reasoning_effort). Always passed, so a
#   run never depends on the CLI's model table, whose per-model defaults
#   differ (gpt-6-astra medium, gpt-5.6-sol low, gpt-5.5 medium,
#   gpt-5.3-codex-spark high). high, the same level the claude-code manifest
#   pins, so runs across agents share one setting; a model's own default
#   is a config override.
# (Web search is one of a run's limits, not a knob here.)
default_options:
  effort: high
entry_point: codex
