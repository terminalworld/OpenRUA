# Claude Code: the facts OpenRUA needs about this agent. The behaviour
# (launch command, transcript parsing, quota handling) is the module named by entry_point
# named at the bottom.
name: claude-code
title: Claude Code
default_model: claude-opus-5
binary: claude
# Root shell that installs the CLI into the sandbox image (build time only:
# the running sandbox has no internet). NodeSource 22.x: the distro node is
# v18 on 24.04 and v12 on 22.04, and Claude Code 2.1.198 and later require
# Node 22, while npm quietly installs the last release an older Node
# satisfies (2.1.197) when no version is pinned. One source for every distro.
# {version} is replaced with a pin when one is given (openrua build sandbox
# --agent claude-code@2.1.301, or agent.version in a config); without a
# pin the release current at build time is installed.
prepare: >-
  apt-get update
  && apt-get install -y --no-install-recommends curl ca-certificates
  && curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  && apt-get install -y --no-install-recommends nodejs
  && rm -rf /var/lib/apt/lists/*
prepare_check: node -e 'if (parseInt(process.versions.node) < 22) process.exit(1)'
install: npm install -g @anthropic-ai/claude-code@{version}
# Hosts the CLI must reach through the proxy (tinyproxy filter regexes).
whitelist:
  - '^api\.anthropic\.com$'
  - '^console\.anthropic\.com$'
  - '^platform\.claude\.com$'
  - '^claude\.ai$'
# Reuse the native file-based login through an OpenRUA directory alias.
# Explicit credentials_dir selects a separate profile; secrets are not copied.
credentials:
  native_dir: .claude
  dirname: claude-code
  filename: .credentials.json
  config_env: CLAUDE_CONFIG_DIR
  mount_point: /claude-config
  # Its own sign-in, which openrua login runs in the sandbox image: a link
  # to open in a browser, then the code the page shows, pasted back.
  login: [claude, auth, login]
# A long-lived token from `claude setup-token`, passed to the CLI by file.
token_env: CLAUDE_CODE_OAUTH_TOKEN
# Where the newest release is named, for the update offer at start.
latest_release: https://registry.npmjs.org/@anthropic-ai/claude-code/latest
version_argv: [claude, --version]
# The oldest release seen taking every flag below (--autocompact is newer
# than 2.1.197, which exits on it); an older sandbox CLI is refused before
# the agent starts.
min_version: 2.1.251
# Knobs a config may override under agent.options. All pinned explicitly
# so a CLI update cannot shift them:
# - effort: reasoning level (low, medium, high, xhigh, max)
# - autocompact: compaction threshold; 1M = compact only when the context
#   will not fit
# - bash_timeout_ms / bash_max_timeout_ms: a robot motion outlives the
#   CLI's 120 s Bash default
default_options:
  effort: high
  autocompact: 1M
  bash_timeout_ms: 600000
  bash_max_timeout_ms: 1800000
entry_point: claude_code
