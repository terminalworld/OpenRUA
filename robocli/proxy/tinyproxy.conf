# Model-API-only internet wall (mainline network lock, 2026-08-08).
# The sandbox reaches the internet exclusively through this proxy, and the
# proxy forwards exclusively to the model API endpoint. Everything else
# is refused; the inference layer (L1) flows, the tool layer (L2) stays
# offline.
Port 8888
Timeout 600
MaxClients 32

# Whitelist filtering: default-deny, allow only the filter file entries.
Filter "/etc/tinyproxy/filter"
FilterURLs Off
FilterExtended On
FilterDefaultDeny Yes

# Only HTTPS CONNECT to 443 is ever needed.
ConnectPort 443
