# Franka Emika Panda on a tabletop (robosuite / MuJoCo, CaP-Bench scenes),
# ROS 2 Humble. configs/benchmarks/capbench.yaml names it under `robot:`.

# The scene `robocli up panda-sim-humble` loads when no benchmark is named.
world:
  benchmark: capbench
  task_suite: capbench
  task_id: 0

machine:
  backend:
    kind: sim
    image: robocli-sim-humble
    sandbox_image: robocli-sandbox-humble  # sandbox distro == robot distro:
                                # cross-distro moveit_msgs break service
                                # responses (Fast CDR)
    simulator:
      venv: cap-x/.venv-capbench  # py3.10 == Humble; a venv of its own,
                                  # separate from .venv-libero
      container: sim-humble

  workspace_template: workspace

  controller: JOINT_POSITION   # their low level uses panda_joint_ctrl.json,
                               # the same joint-space shape as LIBERO
  controller_kp_scale: 1       # their JSON already carries tuned gains
                               # (kp=1500, input_type absolute); the x10
                               # LIBERO's stock kp=50 needs does not apply

  cameras:
    resolution: [640, 480]
    list: null             # publish every camera the scene defines
    rate_hz: 2
    render_mode: on_demand  # render a camera only while subscribed
                            # (indistinguishable to the agent; 'always'
                            # renders regardless, for debugging)

  control:               # graph-side actuation behavior (named apart from
                         # the gripper/arm facts below, which feed machine.yaml)
    gripper:
      open_threshold_m: 0.02
      settle_steps: 10

  ports:                 # the same franka_ros2-shaped surface (same robot)
    twist: /servo_node/delta_twist_cmds
    trajectory: /panda_arm_controller/follow_joint_trajectory
    gripper: /franka_gripper/gripper_action
    wrench: /franka_robot_state_broadcaster/external_wrench

  joint_name_map:
    robot0_: panda_
    gripper0_: panda_

  # The facts machine.yaml is generated from: the same Panda as LIBERO.
  robot:
    model: Franka Emika Panda
    description: 7-joint robot arm with a parallel-jaw gripper
  frames: {world: world, base: panda_link0, hand: panda_hand}
  arm:
    joints: [panda_joint1, panda_joint2, panda_joint3, panda_joint4,
             panda_joint5, panda_joint6, panda_joint7]
    limits_rad: [[-2.90, 2.90], [-1.76, 1.76], [-2.90, 2.90],
                 [-3.07, -0.07], [-2.90, 2.90], [-0.02, 3.75],
                 [-2.90, 2.90]]
  gripper: {open_m: 0.04, closed_m: 0.0, max_effort: 30.0,
            stops_at: [open, closed]}
  planning: {moveit: true, move_action: /move_action,
             ik_service: /compute_ik, group: panda_arm,
             planning_frame: panda_link0}  # model frame; the IK request's
                             # frame_id must be empty

  tf:
    hand: false

# Per-suite machine differences live in the benchmark config's
# suite_overrides (merged by apply_suite_overrides on the trial's resolved
# config; null deletes a key): the wipe task's Panda mounts a rigid 0-DoF
# wiping pad, not the parallel-jaw gripper, so its gripper keys are nulled.
