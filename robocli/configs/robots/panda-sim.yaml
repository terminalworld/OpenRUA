# Franka Emika Panda on a tabletop (robosuite / MuJoCo, LIBERO-PRO scenes).
# The default simulated robot. Loaded by `robocli up panda-sim`;
# benchmarks/libero_pro.yaml names it under `robot:`.

# The scene `robocli up panda-sim` loads when no benchmark is named.
world:
  benchmark: libero_pro
  task_suite: libero_goal_task
  task_id: 0

machine:
  backend:                  # how the robot is provided
    kind: sim
    # Spelled out rather than left to the code's default (audit F9
    # 2026-08-14: a hardcoded jazzy name recorded a digest the humble legs
    # never ran). Same values the default resolves to today, so nothing
    # changes; the config now says which images it runs instead of the
    # answer living in a fallback elsewhere.
    image: robocli-sim-jazzy
    sandbox_image: robocli-sandbox
    simulator:
      venv: cap-x/.venv-libero   # py3.12
      container: sim-jazzy

  workspace_template: workspace  # skin layer sole carrier
                         # (design-decisions 2026-08-10); machine.yaml is
                         # generated from the facts + ports below at
                         # seeding; tree sha256 pinned in config.json

  controller: JOINT_POSITION  # base action space (real-robot shape: both
                              # ports above a joint layer; OSC rejected by
                              # measurement — null-space drift, see plan P1)
  controller_kp_scale: 10     # stock kp=50 tracks ~15% of a 20Hz carrot;
                              # measured gain: x10 -> 0.92, x20 overshoots

  cameras:               # copy the scene's own cameras (assembly discipline)
    resolution: [640, 480]
    list: null           # null = publish every camera the scene defines
    rate_hz: 2           # wall-clock render/publish rate (pull-style; never steps)

  control:               # graph-side actuation behavior (named apart from
                         # the gripper/arm FACTS below, which feed the manual)
    gripper:
      open_threshold_m: 0.02 # GripperCommand position below this = close
      settle_steps: 10       # control ticks a gripper goal advances the world

  ports:                 # franka_ros2 / moveit_servo-shaped names
    twist: /servo_node/delta_twist_cmds            # TwistStamped (L4)
    trajectory: /panda_arm_controller/follow_joint_trajectory  # FJT action (L3, with P2)
    gripper: /franka_gripper/gripper_action        # GripperCommand action
    wrench: /franka_robot_state_broadcaster/external_wrench    # WrenchStamped

  joint_name_map:        # robosuite internal -> franka_ros2 published names
    robot0_: panda_
    gripper0_: panda_

  # Machine-manifest facts (workspace machine.yaml is generated from
  # these + ports: at seeding — single source, bridge and docs cannot
  # drift).
  robot:
    model: Franka Emika Panda
    description: 7-joint robot arm with a parallel-jaw gripper
  frames: {world: world, base: panda_link0, hand: panda_hand}
  arm:
    joints: [panda_joint1, panda_joint2, panda_joint3, panda_joint4,
             panda_joint5, panda_joint6, panda_joint7]
    limits_rad: [[-2.90, 2.90], [-1.76, 1.76], [-2.90, 2.90],
                 [-3.07, -0.07], [-2.90, 2.90], [-0.02, 3.75],
                 [-2.90, 2.90]]
  gripper: {open_m: 0.04, closed_m: 0.0, max_effort: 30.0,
            stops_at: [open, closed]}
  hand: {tcp_offset_m: 0.1034}  # hand frame -> fingertip grasp
                                # point (audit A2, 5 groups)
  planning: {moveit: true, move_action: /move_action,
             ik_service: /compute_ik, group: panda_arm,
             planning_frame: panda_link0}  # model frame; IK
                             # frame_id must be EMPTY (audit A1)

  tf:
    hand: false          # mainline: robot_state_publisher (MoveIt stack)
                         # owns the arm chain; bridge keeps base + cameras
