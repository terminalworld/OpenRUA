# Franka Panda on an Omron holonomic mobile base (RoboCasa365 kitchens),
# ROS 2 Humble. configs/benchmarks/robocasa365.yaml names it under `robot:`.

# The scene `robocli up panda-omron-sim` loads when no benchmark is named.
world:
  benchmark: robocasa365
  task_suite: robocasa365
  task_id: 0

machine:
  backend:
    kind: sim
    image: robocli-sim-humble    # py3.10 == Humble, the same image as capbench
    sandbox_image: robocli-sandbox-humble  # sandbox distro == robot distro
    gpus: false                  # true on a GPU host (nvidia-container-toolkit
                                 # required): EGL rendering moves to the GPU
                                 # (~214 -> ~10 ms/frame on whole-room
                                 # scenes); physics stays CPU, so results
                                 # stay comparable across render devices
    simulator:
      venv: robocasa365/.venv-robocasa   # a venv of its own
      container: sim-humble

  workspace_template: workspace

  controller: JOINT_POSITION
  controller_config: controllers/pandaomron_joint_ctrl.json  # under configs/robots/ (bundled, then ~/.robocli/robots/), or a path
  controller_kp_scale: 1       # gains live in the JSON (kp=1500 arm, their
                               # defaults for torso/base)

  cameras:
    resolution: [640, 480]
    # Their canonical eval cameras; the scene defines many more, narrowed
    # to keep render cost sane on whole-room scenes under software rendering.
    list: [robot0_agentview_left, robot0_agentview_right, robot0_eye_in_hand]
    rate_hz: 2
    render_mode: on_demand  # render a camera only while subscribed
                            # (indistinguishable to the agent; 'always'
                            # renders regardless, for debugging)

  control:               # graph-side actuation behavior (named apart from
                         # the gripper/arm facts below, which feed machine.yaml)
    gripper:
      open_threshold_m: 0.02
      settle_steps: 10

  ports:                       # franka_ros2-shaped arm surface + mobile base
    twist: /servo_node/delta_twist_cmds
    trajectory: /panda_arm_controller/follow_joint_trajectory
    gripper: /franka_gripper/gripper_action
    wrench: /franka_robot_state_broadcaster/external_wrench
    base_twist: /cmd_vel       # plain geometry_msgs/Twist (REP-119 shape)
    odom: /odom

  joint_name_map:
    robot0_: panda_
    gripper0_: panda_

  # The facts machine.yaml is generated from.
  robot:
    model: Franka Emika Panda on Omron mobile base (PandaOmron)
    description: 7-joint arm with parallel-jaw gripper on a holonomic
      mobile base
  frames: {world: world, base: panda_link0, hand: panda_hand}
  arm:
    joints: [panda_joint1, panda_joint2, panda_joint3, panda_joint4,
             panda_joint5, panda_joint6, panda_joint7]
    limits_rad: [[-2.90, 2.90], [-1.76, 1.76], [-2.90, 2.90],
                 [-3.07, -0.07], [-2.90, 2.90], [-0.02, 3.75],
                 [-2.90, 2.90]]
  gripper: {open_m: 0.04, closed_m: 0.0, max_effort: 30.0,
            stops_at: [open, closed]}
  base:                      # a mobile base
    type: holonomic          # omnidirectional: vx, vy, wz all actuated
    body: mobilebase0_base   # the body that actually rides the base
                             # (robot0_base is a static dummy)
    frame: base_footprint
    effective_speed_note: unit vx tracks ~0.056 m/s effective
      (velocity ramp restarts per message)
    cmd_vel: /cmd_vel
    odom: /odom
    # Measured: unit vx tracks ~0.056 m/s effective under one-message-one-
    # tick paused-clock streaming (their velocity ramp restarts per goal).
    # Surfaced to the agent through the workspace docs, not tuned away.
  planning: {moveit: true, move_action: /move_action,
             ik_service: /compute_ik, group: panda_arm,
             planning_frame: panda_link0}  # model frame; the IK request's
                             # frame_id must be empty

  tf:
    hand: false
    base_body: robot0_link0    # the arm root rides the mobile base
                               # (robot0_base is a static dummy on PandaOmron)
