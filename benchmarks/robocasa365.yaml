# RoboCasa365 assembly config — third mainline leg (P8). Same bridge code;
# the increment over the arm-only legs is the mobile base: /cmd_vel in,
# /odom out (notes/04 "共享桥设计 + 移动底盘增量"). Envs are built through
# robosuite.make with THEIR factory kwargs verbatim (see
# envs._create_robocasa_env); only controller_configs is swapped to our
# JOINT_POSITION composite — same measurement-backed position as the
# LIBERO-leg OSC rejection. Tasks/scenes/predicates/split stay theirs.
# Four top-level sections (schema ruling 2026-08-17): task / protocol /
# agent / machine; key names unchanged, keys only moved home.

task:
  benchmark: robocasa365
  # Pilot spectrum over the atomic layer: pick-place, navigation (base
  # port under load), articulation, switch, placement. Full-scale task
  # list is a later go/no-go (365 tasks; see notes/08 §3 n 分期).
  # Here the suite string IS their env-registry name (no prefix).
  suites: [PickPlaceCounterToCabinet, NavigateKitchen, OpenCabinet,
           TurnOnStove, CoffeeSetupMug]
  # OpenDoor is the abstract door task (requires fixture_id) — the
  # instantiable variants bind it (OpenCabinet/OpenMicrowave/...);
  # canary 2026-08-11 caught the bad name.
  split: target              # held-out layouts/styles 1-10 (their eval
                             # split mapping, copied verbatim)
  init_states: seeded-reset  # seed -> env.rng -> reset (their gym
                             # wrapper's semantics)

protocol:
  trials_per_task: 50        # TODO verify against their leaderboard
                             # protocol before the scale phase; pilot = 3
  max_turns: 500             # generous ceiling (post-hoc budget ruling 2026-08-12)
  active_wall_clock_minutes: 240    # generous ceiling; paper budgets applied POST-HOC
                             # via success_at stamps (closed-book = exact;
                             # design-decisions 2026-08-12)
  # Waiting out a quota wall is bounded (2026-08-20): past either bound the
  # trial gives up as quota-limited and the master requeues it, exactly as
  # before resume existed. 360min covers a five-hour window with slack; a
  # weekly wall is deliberately NOT waited out.
  max_quota_wait_minutes: 360
  max_suspensions: 4
  # Suspend at a quota wall and resume the same session instead of losing
  # the trial (2026-08-20). ON for our runs and OFF by default in the code:
  # the wall comes from running at scale on subscription accounts, not from
  # the method, and a single-trial reproduction through an API key never
  # meets one. Recorded per trial, so a result says which way it ran.
  resume_on_quota_wall: true
  clock:
    mode: paused
  base_cmd_policy: queue   # queue = 1 msg -> 1 tick, deterministic, flood-
                           # fused at depth 4 (mainline). latest = real-robot
                           # setpoint semantics (free-clock/real legs only).
                           # design-decisions 2026-08-12.

agent:                       # same frontier combo + workspace template
  cli: claude-code       # agent adapter (robocli/agents) — all agent-specific
                         # knowledge (launch/auth/transcript/quota) lives there
  model: claude-opus-5
  effort: high           # reasoning effort, PINNED (opus-5 default; pinned vs
                         # CLI-default drift; stamped into each trial's meta)
  credentials_dir: ~/.robocli-claude

robot: panda-omron-sim          # robots/panda-omron-sim.yaml supplies the machine: section

